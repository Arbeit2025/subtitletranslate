services:
  - type: web
    name: subtitletranslate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11
      # Azure Translator を使う場合は、Render の Environment 画面で
      # 本人が以下の3つを設定する（コードやGitには書かない）。
      # - AZURE_TRANSLATOR_KEY
      # - AZURE_TRANSLATOR_REGION
      # - AZURE_TRANSLATOR_ENDPOINT（任意。未設定時は既定のグローバルエンドポイント）
